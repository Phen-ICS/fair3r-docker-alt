
services:
  nginx:
    build:
      context: nginx/
      dockerfile: Dockerfile
    depends_on:
      ckan:
        condition: service_healthy
    ports:
      - "${NGINX_SSLPORT_HOST}:${NGINX_SSLPORT}"
    volumes:
      - ./nginx/certs:/etc/nginx/certs
    restart: unless-stopped
    environment:
      FAIR3R_CONTEXT: ${FAIR3R_CONTEXT}
    networks:
      - webnet
      - ckannet

  db:
    image: postgres:14
    container_name: ckan-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CKAN_DB_NAME}
      POSTGRES_USER: ${CKAN_DB_USER}
      POSTGRES_PASSWORD: ${CKAN_DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CKAN_DB_USER} -d ${CKAN_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dbnet

  solr:
    image: ckan/ckan-solr:2.11-solr9
    container_name: ckan-solr
    restart: unless-stopped
    volumes:
      - solr_data:/var/solr
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8983/solr/ckan/admin/ping | grep -q '\"status\":\"OK\"'"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - solrnet

  redis:
    image: redis:7-alpine
    container_name: ckan-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - redisnet

  ckan:
    build:
      context: ./ckan
      args:
        CKAN_VERSION: ${CKAN_VERSION}
        FAIR3R_CONTEXT: ${FAIR3R_CONTEXT}
    container_name: ckan-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CKAN_DEBUG: ${CKAN_DEBUG}
      FAIR3R_CONTEXT: ${FAIR3R_CONTEXT}
      CKAN_INI_TEMPLATE: /srv/app/config/ckan.ini.template
      CKAN_INI: /srv/app/ckan.ini
      CKAN_SOLR_URL: http://solr:8983/solr/ckan
      CKAN_REDIS_URL: redis://redis:6379/1
      CKAN_INTERNAL_SITE_URL: ${CKAN_INTERNAL_SITE_URL}
      CKAN_XLOADER_JOBS_DB_URI: postgresql://${CKAN_DB_USER}:${CKAN_DB_PASSWORD}@db/${CKAN_DB_NAME}
      CKAN_EXTRA_PLUGINS: ${CKAN_EXTRA_PLUGINS}
      CKAN_EXTRA_VIEWS: ${CKAN_EXTRA_VIEWS}
      CKAN_TEST_DB_NAME: ${CKAN_TEST_DB_NAME}
      CKAN_DATASTORE_TEST_DB_NAME: ${CKAN_DATASTORE_TEST_DB_NAME}
    depends_on:
      db:
        condition: service_healthy
      solr:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ckan_storage:/var/lib/ckan
      - ./ckan/config:/srv/app/config:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/api/3/action/status_show || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 15
    networks:
      - ckannet
      - dbnet
      - solrnet
      - redisnet

volumes:
  db_data:
  solr_data:
  redis_data:
  ckan_storage:

networks:
  webnet:
  ckannet:
  solrnet:
    internal: true
  dbnet:
    internal: true
  redisnet:
    internal: true
