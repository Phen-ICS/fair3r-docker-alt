[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:ckan-web]
command=ckan -c /srv/app/ckan.ini run --host 0.0.0.0 --port 5000 --disable-reloader
directory=/srv/app
autostart=true
autorestart=true
startsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
user=ckan

[program:xloader-worker]
command=ckan -c /srv/app/ckan.ini jobs worker
directory=/srv/app
autostart=true
autorestart=true
startsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
user=ckan

; ckanext-harvest's own Redis-queue consumers (distinct from the generic
; `ckan jobs worker` above). Self-gating: if the `harvest` plugin isn't in
; ckan.plugins (e.g. ckanext-harvest isn't even installed today), the
; command sleeps instead of erroring, so this is harmless either way.
;
; These consumers crash with a Redis BLPOP timeout as soon as the queue is
; empty - not just occasionally, but immediately and every time there's no
; harvest job in flight (idle steady-state, not a transient blip). Plain
; autorestart=true isn't enough: supervisor's own startsecs/startretries
; protection against crash-loops kicks in first and gives up, leaving the
; program in FATAL (dead, not retried) rather than RUNNING. The retry loop
; is done ourselves in the wrapper instead, so from supervisor's point of
; view the (outer) process never exits and none of that logic applies.
[program:harvest-gather-consumer]
command=bash -c 'if grep -E "^ckan\.plugins" /srv/app/ckan.ini | grep -qw harvest; then while true; do ckan -c /srv/app/ckan.ini harvester gather-consumer; sleep 2; done; else exec sleep infinity; fi'
directory=/srv/app
autostart=true
autorestart=true
startsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
user=ckan

[program:harvest-fetch-consumer]
command=bash -c 'if grep -E "^ckan\.plugins" /srv/app/ckan.ini | grep -qw harvest; then while true; do ckan -c /srv/app/ckan.ini harvester fetch-consumer; sleep 2; done; else exec sleep infinity; fi'
directory=/srv/app
autostart=true
autorestart=true
startsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
user=ckan
