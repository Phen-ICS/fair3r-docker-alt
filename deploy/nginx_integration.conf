# Fair3R CKAN — integration VM (native nginx).
# TLS: terminated on an upstream reverse proxy; this file is HTTP :80.
# Keep Ansible group_vars `ckan.site_url` in sync with `server_name` below.
#
# Structure matches deploy/nginx_validation.conf (no production proxy_cache).

upstream fair3r_ckan {
    server 127.0.0.1:8080;
}

proxy_temp_path /tmp/nginx_proxy 1 2;

server {
    listen 80;
    listen [::]:80;
    server_name fair3r.integration.igbmc.u-strasbg.fr;

    client_max_body_size 100M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    access_log /var/log/nginx/fair3r_integration_access.log;
    error_log  /var/log/nginx/fair3r_integration_error.log;

    location / {
        proxy_pass http://fair3r_ckan;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
