---
# Install Postgres and create CKAN + datastore roles / databases.
#
# Replicates the ensure-role / ensure-db logic from ckan/scripts/entrypoint.sh
# but uses community.postgresql modules so the tasks are idempotent and clean.

- name: Install PostgreSQL server
  apt:
    name:
      - postgresql
      - postgresql-contrib
    state: present
    update_cache: yes

- name: Ensure PostgreSQL service is started and enabled
  service:
    name: postgresql
    state: started
    enabled: yes

# --- CKAN main database role + db ------------------------------------------
- name: Create CKAN database role
  community.postgresql.postgresql_user:
    name: "{{ ckan_db_user }}"
    password: "{{ env_config.ckan_db_password }}"
    role_attr_flags: LOGIN
    state: present
    encrypted: yes
  become_user: postgres

- name: Create CKAN main database
  community.postgresql.postgresql_db:
    name: "{{ ckan_db_name }}"
    owner: "{{ ckan_db_user }}"
    encoding: UTF-8
    lc_collate: en_US.UTF-8
    lc_ctype: en_US.UTF-8
    template: template0
    state: present
  become_user: postgres

# --- Datastore role (read-write) + db --------------------------------------
- name: Create datastore read-write role
  community.postgresql.postgresql_user:
    name: "{{ ckan_datastore_db_user }}"
    password: "{{ env_config.ckan_datastore_db_password }}"
    role_attr_flags: LOGIN
    state: present
    encrypted: yes
  become_user: postgres

- name: Create datastore read-only role
  community.postgresql.postgresql_user:
    name: "{{ ckan_datastore_readonly_user }}"
    password: "{{ env_config.ckan_datastore_readonly_password }}"
    role_attr_flags: LOGIN
    state: present
    encrypted: yes
  become_user: postgres

- name: Create datastore database
  community.postgresql.postgresql_db:
    name: "{{ ckan_datastore_db_name }}"
    owner: "{{ ckan_datastore_db_user }}"
    encoding: UTF-8
    lc_collate: en_US.UTF-8
    lc_ctype: en_US.UTF-8
    template: template0
    state: present
  become_user: postgres

# --- Test databases (mirror entrypoint.sh) ---------------------------------
- name: Create CKAN test database
  community.postgresql.postgresql_db:
    name: "{{ ckan_test_db_name }}"
    owner: "{{ ckan_db_user }}"
    encoding: UTF-8
    lc_collate: en_US.UTF-8
    lc_ctype: en_US.UTF-8
    template: template0
    state: present
  become_user: postgres

- name: Create datastore test database
  community.postgresql.postgresql_db:
    name: "{{ ckan_datastore_test_db_name }}"
    owner: "{{ ckan_datastore_db_user }}"
    encoding: UTF-8
    lc_collate: en_US.UTF-8
    lc_ctype: en_US.UTF-8
    template: template0
    state: present
  become_user: postgres
