---
# Install all CKAN extensions into the package venv at /usr/lib/ckan/default.
#
# Matches docker-compose CKAN entrypoint Fair3R install: GitLab Package Registry PyPI URLs with
# per-extension tokens (see ansible/group_vars/all.yml → ckan_extensions_gitlab_pypi_project_ids).

- name: Copy common CKAN requirements
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../ckan/requirements.txt"
    dest: "{{ ckan_common_requirements_file }}"
    owner: root
    group: root
    mode: "0644"

- name: Install common CKAN requirements
  ansible.builtin.pip:
    requirements: "{{ ckan_common_requirements_file }}"
    virtualenv: "{{ ckan_venv }}"
    extra_args: "--no-deps"

# Fair3R forks: wheels from GitLab Package Registry (PyPI API).
# Project IDs: in ansible/group_vars/all.yml.
- name: Install Fair3R CKAN extensions from GitLab Package Registry (PyPI)
  ansible.builtin.pip:
    name: "{{ item.key }}"
    virtualenv: "{{ ckan_venv }}"
    state: latest
    extra_args: "--no-cache-dir --force-reinstall --no-deps --index-url https://pypi.org/simple --extra-index-url https://__token__:{{ env_config.extension_pypi_tokens[item.key] | urlencode }}@{{ gitlab_extensions_pypi_host }}/api/v4/projects/{{ item.value | int }}/packages/pypi/simple"
  loop: "{{ ckan_extensions_gitlab_pypi_project_ids | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  environment:
    PIP_PROGRESS_BAR: "off"
  changed_when: true
  no_log: true

- name: Read installed versions of Fair3R CKAN extensions
  command:
    argv:
      - "{{ ckan_venv }}/bin/python"
      - -c
      - |
        from importlib.metadata import version
        packages = [
            "ckanext-fair3r",
            "ckanext-pages",
            "ckanext-fair3r-doi",
            "ckanext-plotly",
        ]
        for package in packages:
            print(f"{package}=={version(package)}")
  register: fair3r_extensions_versions
  changed_when: false

- name: Print installed versions of Fair3R CKAN extensions
  debug:
    msg: "{{ fair3r_extensions_versions.stdout_lines }}"

# ckanext-dsaudit is loaded from git; the tree often has no i18n/ directory in
# the installed wheel/sdist layout.  CKAN 2.11's `ckan run` calls
# build_js_translations() which does os.listdir() on each plugin's i18n path and
# crashes with FileNotFoundError if the directory is missing — systemd then
# restarts ckan-web until verification times out (connection refused).
- name: Resolve ckanext-dsaudit install path
  ansible.builtin.command:
    argv:
      - "{{ ckan_venv }}/bin/python"
      - -c
      - "import os, ckanext.dsaudit; print(os.path.dirname(ckanext.dsaudit.__file__))"
  register: dsaudit_pkg_dir
  changed_when: false

- name: Ensure ckanext-dsaudit i18n directory exists
  ansible.builtin.file:
    path: "{{ dsaudit_pkg_dir.stdout | trim }}/i18n"
    state: directory
    mode: "0755"

# pip runs as root, but fair3r update-schema (daily cron) runs as ckan and
# writes into ckanext/fair3r/schema/ (fdf_schema.json and i18n sidecars).
# This task must run AFTER pip install to ensure permissions are not overwritten.
- name: Resolve ckanext-fair3r schema directory
  ansible.builtin.command:
    argv:
      - "{{ ckan_venv }}/bin/python"
      - -c
      - "import ckanext.fair3r.tasks as tasks; print(tasks.SCHEMA_DIR)"
  register: fair3r_schema_dir
  changed_when: false

- name: Debug resolved schema directory path
  ansible.builtin.debug:
    msg: "Resolved schema dir: '{{ fair3r_schema_dir.stdout | trim }}'"
  when: fair3r_schema_dir.stdout is defined and fair3r_schema_dir.stdout | trim != ""

- name: Ensure ckanext-fair3r schema directory and all contents are owned by CKAN user
  ansible.builtin.file:
    path: "{{ fair3r_schema_dir.stdout | trim }}"
    state: directory
    owner: "{{ ckan_os_user }}"
    group: "{{ ckan_os_user }}"
    mode: "0755"
    recurse: yes
