---
# Install all CKAN extensions into the package venv at /usr/lib/ckan/default.
#
# Matches docker-compose CKAN entrypoint Fair3R install: GitLab Package Registry PyPI URLs with
# per-extension tokens (see ansible/group_vars/all.yml → ckan_extensions_gitlab_pypi_project_ids).

- name: Install pinned extension dependencies (xloader + helpers)
  pip:
    name:
      - "ckanext-xloader==2.3.0"
      - "chardet==4.0.0"
      - "tabulator==1.53.5"
      - "unidecode==1.4.0"
    virtualenv: "{{ ckan_venv }}"
    state: present

- name: Install open-source CKAN extensions (pdfview, contact, dsaudit)
  pip:
    name: "{{ item }}"
    virtualenv: "{{ ckan_venv }}"
    state: latest
  loop:
    - "git+https://github.com/ckan/ckanext-pdfview.git@master#egg=ckanext-pdfview"
    - "git+https://github.com/NaturalHistoryMuseum/ckanext-contact.git@main#egg=ckanext-contact"
    - "git+https://github.com/ckan/ckanext-dsaudit.git@master#egg=ckanext-dsaudit"

# Fair3R forks: wheels from GitLab Package Registry (PyPI API).
# Project IDs: in ansible/group_vars/all.yml.
- name: Install Fair3R CKAN extensions from GitLab Package Registry (PyPI)
  pip:
    name: "{{ item.key }}"
    virtualenv: "{{ ckan_venv }}"
    state: latest
    extra_args: >-
      --upgrade
      --index-url https://pypi.org/simple
      --extra-index-url https://__token__:{{ env_config.extension_pypi_tokens[item.key] | urlencode }}@{{ gitlab_extensions_pypi_host }}/api/v4/projects/{{ item.value | int }}/packages/pypi/simple
  loop: "{{ ckan_extensions_gitlab_pypi_project_ids | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  environment:
    PIP_PROGRESS_BAR: "off"
  no_log: true

# ckanext-dsaudit is loaded from git; the tree often has no i18n/ directory in
# the installed wheel/sdist layout.  CKAN 2.11's `ckan run` calls
# build_js_translations() which does os.listdir() on each plugin's i18n path and
# crashes with FileNotFoundError if the directory is missing — systemd then
# restarts ckan-web until verification times out (connection refused).
- name: Resolve ckanext-dsaudit install path
  command:
    argv:
      - "{{ ckan_venv }}/bin/python"
      - -c
      - "import os, ckanext.dsaudit; print(os.path.dirname(ckanext.dsaudit.__file__))"
  register: dsaudit_pkg_dir
  changed_when: false

- name: Ensure ckanext-dsaudit i18n directory exists
  file:
    path: "{{ dsaudit_pkg_dir.stdout | trim }}/i18n"
    state: directory
    mode: "0755"
