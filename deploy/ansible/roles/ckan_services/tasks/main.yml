---
# Install systemd units for CKAN web + xloader worker.
# Web: uWSGI (CKAN deb default) rather than `ckan run`; worker runs `ckan jobs worker`.
# Runs as the 'ckan' package user.

- name: Install Fair3R uWSGI configuration for CKAN
  template:
    src: ckan-uwsgi.ini.j2
    dest: "{{ ckan_uwsgi_ini }}"
    owner: root
    group: "{{ ckan_os_user }}"
    mode: "0640"
  notify: reload systemd and restart ckan-web

- name: Install ckan-web systemd unit
  template:
    src: ckan-web.service.j2
    dest: /etc/systemd/system/ckan-web.service
    mode: '0644'
  notify: reload systemd and restart ckan-web

- name: Install ckan-worker systemd unit
  template:
    src: ckan-worker.service.j2
    dest: /etc/systemd/system/ckan-worker.service
    mode: '0644'
  notify: reload systemd and restart ckan-worker

- name: Force handlers to run now (so restarts happen before verification)
  meta: flush_handlers

- name: Enable and start ckan-web
  systemd:
    name: ckan-web
    enabled: yes
    state: started
    daemon_reload: yes

- name: Enable and start ckan-worker
  systemd:
    name: ckan-worker
    enabled: yes
    state: started
    daemon_reload: yes
