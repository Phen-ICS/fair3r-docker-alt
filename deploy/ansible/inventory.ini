# Ansible inventory for Fair3R CKAN deployment.
#
# Each context maps to a single host (same pattern as the ics-standalone-app-template
# reference project). These placeholder names are never actually used: CI
# always overrides the host via ansible_deploy.py's --host flag (see
# .gitlab-ci.yml's SSH_HOST variable, environment-scoped per deploy job), so
# ansible-playbook's own target_host var takes precedence over this file.
# Only relevant for a manual/local run without --host.

[validation]
your-validation-host.example.org

[integration]
your-integration-host.example.org

[production]
your-production-host.example.org
