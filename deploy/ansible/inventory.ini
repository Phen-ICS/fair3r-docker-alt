# Ansible inventory for Fair3R CKAN deployment.
#
# Each context maps to a single host (same pattern as the ics-standalone-app-template
# reference project). ansible_deploy.py's --host flag (sourced from the
# SSH_HOST GitLab CI variable, environment-scoped per deploy job) sets
# target_host, which the playbook uses as its `hosts:` pattern - but Ansible
# still needs that hostname declared here to resolve the pattern AND to pick
# up this group's group_vars/<context>.yml. These are real, used values, not
# placeholders: do not genericize this file without also reworking how the
# target host is registered (e.g. a dynamic add_host play), or deploys will
# silently no-op ("Could not match supplied host pattern" / "skipping: no
# hosts matched" - GitLab still reports the job as succeeded).

[validation]
serv-ics-fair3r-d-01

[integration]
serv-ics-fair3r-t-01

[production]
serv-ics-fair3r-p-02
