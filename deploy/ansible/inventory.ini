# Ansible inventory for Fair3R CKAN deployment.
#
# Intentionally empty: fair3r_deploy.yml's first play (`add_host`) registers
# the real target host dynamically, from target_host (ansible_deploy.py's
# --host, i.e. this organization's SSH_HOST GitLab CI variable) into the
# context's group below - so no organization's real hostname needs to be
# committed here. The three group names still need to exist and match
# validation/integration/production (ansible_deploy.py's --env), since
# that's what selects which group_vars/<context>.yml file loads.

