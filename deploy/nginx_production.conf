# Fair3R CKAN — production VM (native nginx).
# TLS: terminated on an upstream reverse proxy; this file is HTTP :80.
# Templated by roles/nginx (not a plain copy): `server_name` is derived from
# CKAN_SITE_URL, so it always matches ckan.site_url without needing a
# per-organization edit of this file.
#
# Structure matches deploy/nginx_validation.conf; this file adds a small
# `proxy_cache` for anonymous GETs (skipped for auth-ticket users).

upstream fair3r_ckan {
    server 127.0.0.1:8080;
}

proxy_temp_path /tmp/nginx_proxy 1 2;

proxy_cache_path /var/cache/nginx/fair3r levels=1:2 keys_zone=fair3r_cache:10m
                 max_size=1g inactive=60m use_temp_path=off;

server {
    listen 80;
    listen [::]:80;
    server_name {{ env_config.ckan_site_url | urlsplit('hostname') }};

    client_max_body_size 20M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    access_log /var/log/nginx/fair3r_production_access.log;
    error_log  /var/log/nginx/fair3r_production_error.log;

    location / {
        proxy_pass http://fair3r_ckan;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache fair3r_cache;
        proxy_cache_bypass $cookie_auth_tkt;
        proxy_no_cache $cookie_auth_tkt;
        proxy_cache_valid 30m;
        proxy_cache_key $host$scheme$proxy_host$request_uri;
    }

    # ckanext-zenodo streams large/non-tabular files through here before
    # relaying them to Zenodo (never stored permanently on this VM, see
    # that plugin's blueprints/zenodo_upload.py) - the blanket 20M limit
    # above is sized for CKAN's own resource uploads, not this path.
    # Kept in sync with ckanext.zenodo.max_file_size_bytes
    # (zenodo_config.py's DEFAULT_MAX_FILE_SIZE_BYTES) - raise both
    # together, never just one. proxy_request_buffering off avoids
    # nginx *also* spooling the whole body to its own disk on top of
    # what Werkzeug already does CKAN-side for the same request.
    location /zenodo/upload/ {
        client_max_body_size 10G;
        proxy_request_buffering off;
        client_body_timeout 600s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        proxy_pass http://fair3r_ckan;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
