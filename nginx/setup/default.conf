# Local docker-compose nginx: same reverse-proxy header pattern as
# deploy/nginx_{validation,integration,production}.conf (TLS in-container for dev; VM deploy uses
# HTTP to CKAN and TLS on an upstream reverse proxy).
server {
    #listen       80;
    #listen  [::]:80;
    listen       443 ssl;
    listen  [::]:443 ssl;
    server_name  localhost;
    ssl_certificate /etc/nginx/certs/ckan-local.crt;
    ssl_certificate_key /etc/nginx/certs/ckan-local.key;
    
    # TLS 1.2 & 1.3 only
    ssl_protocols TLSv1.2 TLSv1.3;

    # Disable weak ciphers
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256';

    # SSL sessions
    ssl_session_timeout 1d;
    # ssl_session_cache dfine in stream and http
    ssl_session_tickets off;

    #access_log  /var/log/nginx/host.access.log  main;

    location / {
        proxy_pass http://ckan:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        #proxy_cache cache;
        proxy_cache_bypass $cookie_auth_tkt;
        proxy_no_cache $cookie_auth_tkt;
         ${CACHE_DIRECTIVE}

        proxy_cache_key $host$scheme$proxy_host$request_uri;
    }

    # ckanext-zenodo streams large/non-tabular files through here before
    # relaying them to Zenodo (never stored permanently, see that
    # plugin's blueprints/zenodo_upload.py) - the blanket client_max_body_size
    # above (20M) is sized for CKAN's own resource uploads, not this
    # path. Kept in sync with ckanext.zenodo.max_file_size_bytes
    # (zenodo_config.py's DEFAULT_MAX_FILE_SIZE_BYTES) - raise both
    # together, never just one. proxy_request_buffering off avoids
    # nginx *also* spooling the whole body to disk on top of what
    # Werkzeug already does CKAN-side for the same request.
    location /zenodo/upload/ {
        client_max_body_size 10G;
        proxy_request_buffering off;
        client_body_timeout 600s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        proxy_pass http://ckan:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 400 401 402 403 404 405 406 407 408 409 410 411 412 413 414 415 416 417 418 421 422 423 424 425 426 428 429 431 451 500 501 502 503 504 505 506 507 508 510 511 /error.html;

    # redirect server error pages to the static page /error.html
    #
    location = /error.html {
      ssi on;
      internal;
      auth_basic off;
      root /usr/share/nginx/html;
    }

}