# Fair3R Deploy CI/CD pipeline.
#
# - dev: not driven by CI. Developers run `docker compose up -d --build`
#        locally from the repo root (see root README).
# - validation / integration / production: deployed by this pipeline as native-package installs on
#        Ubuntu Noble VMs via deploy/ansible_deploy.py.
#
# Mirrors the patterns from /opt/ics-standalone-app-template/.gitlab-ci.yml
# (.ssh_setup, .deploy_via_ansible, .ckanext_test, ics-docker runner tag, manual jobs).

stages:
  - lint
  - integration
  - test
  - validation
  - production

# --------------------------------------------------------------------------
# Reusable anchors
# --------------------------------------------------------------------------

.ssh_setup: &ssh_setup
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.10
  before_script:
    - apt update && apt install -y openssh-client
    - mkdir -p ~/.ssh
    - cp /mnt/ssh/* ~/.ssh/
    - chmod 600 ~/.ssh/id_rsa
    - chmod 644 ~/.ssh/known_hosts
    - ssh-keyscan $SSH_HOST >> ~/.ssh/known_hosts
    - pip install ansible 
  tags:
    - ics-docker

.deploy_via_ansible: &deploy_via_ansible
  <<: *ssh_setup
  timeout: 2h
  script:
    - |
      EXTRA_ARGS=""
      if [ -f preview/override.env ]; then
        . preview/override.env
        EXTRA_ARGS="--extension-override-package $PREVIEW_PACKAGE --extension-override-wheel preview/$PREVIEW_WHEEL"
      fi
      python3 deploy/ansible_deploy.py \
        --env "$CONTEXT" \
        --host "$SSH_HOST" \
        --ckan-session-secret "$CKAN_SESSION_SECRET" \
        --ckan-secret-key "$CKAN_SECRET_KEY" \
        --ckan-app-instance-uuid "$CKAN_APP_INSTANCE_UUID" \
        --ckan-db-password "$CKAN_DB_PASSWORD" \
        --ckan-datastore-db-password "$CKAN_DATASTORE_DB_PASSWORD" \
        --ckan-datastore-readonly-password "$CKAN_DATASTORE_READONLY_PASSWORD" \
        --ckan-bootstrap-sysadmin-password "$CKAN_BOOTSTRAP_SYSADMIN_PASSWORD" \
        --ckan-harvest-user-password "$CKAN_HARVEST_USER_PASSWORD" \
        --doi-account-name "$DOI_ACCOUNT_NAME" \
        --doi-account-password "$DOI_ACCOUNT_PASSWORD" \
        --doi-prefix "$DOI_PREFIX" \
        --ckan-email-smtp-password "$CKAN_EMAIL_SMTP_PASSWORD" \
        --ckan-site-url "$CKAN_SITE_URL" \
        --contact-mail "$CONTACT_MAIL" \
        --doi-publisher "$DOI_PUBLISHER" \
        --doi-site-title "$DOI_SITE_TITLE" \
        --ckan-email-smtp-server "$CKAN_EMAIL_SMTP_SERVER" \
        --ckan-email-smtp-user "$CKAN_EMAIL_SMTP_USER" \
        --ckan-email-smtp-mail-from "$CKAN_EMAIL_SMTP_MAIL_FROM" \
        --ckan-email-smtp-reply-to "$CKAN_EMAIL_SMTP_REPLY_TO" \
        --ckan-bootstrap-sysadmin-email "$CKAN_BOOTSTRAP_SYSADMIN_EMAIL" \
        $EXTRA_ARGS

.ckanext_test: &ckanext_test
  <<: *ssh_setup
  stage: test
  needs:
    - deploy_integration
  environment:
    name: integration
  script:
    - |
      python3 deploy/ckanext_test.py \
        --host "$SSH_HOST" \
        --ckan-db-password "$CKAN_DB_PASSWORD" \
        --ckan-datastore-db-password "$CKAN_DATASTORE_DB_PASSWORD" \
        --ckan-datastore-readonly-password "$CKAN_DATASTORE_READONLY_PASSWORD" \
        --tests-module "$CKAN_TESTS_MODULE" \
        --remote-report "$CKAN_REMOTE_REPORT" \
        --local-report "$CKAN_LOCAL_REPORT"

# --------------------------------------------------------------------------
# Lint stage: syntax-check the Ansible playbook.
# --------------------------------------------------------------------------

ansible_lint:
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.10
  before_script:
    - pip install --no-cache-dir ansible ansible-lint
  script:
    # ansible-lint's syntax-check
    - ansible-lint --profile min deploy/ansible/fair3r_deploy.yml
  tags:
    - ics-docker

# --------------------------------------------------------------------------
# Preview artifact fetch: when an extension's MR pipeline triggers this one,
# pull its build:package wheel directly (no registry involved) so
# deploy_integration installs that exact MR build instead of the latest
# PyPI release. Each job no-ops (rules skip) unless its extension triggered
# this pipeline.
#
# Uses the GitLab REST API (jobs/:job_id/artifacts) with a JOB-TOKEN header
# rather than needs:project/artifacts (fails with "needs:need has an
# unsupported type" on this GitLab instance) or jobs/artifacts/:ref/download
# (requires "the latest successful pipeline" for that ref, which can never
# be true here: the extension's pipeline is still running, blocked on this
# very trigger job via strategy: depend). Downloading by job ID only
# requires that one job to have succeeded, not the whole pipeline. The job
# ID is passed down via <EXT>_BUILD_JOB_ID, forwarded by each extension's
# trigger:fair3r-docker-alt:integration job from a dotenv artifact emitted
# by its own build:package job.
#
# Requires each extension project's Job Token allowlist to include this
# project (Settings -> CI/CD -> Job token permission). Project IDs (from the
# old group_vars/all.yml mapping):
# ckanext-fair3r=862, ckanext-doi=860, ckanext-pages=863, ckanext-plotly=891.
# --------------------------------------------------------------------------

fetch:preview:fair3r:
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.10
  rules:
    - if: $FAIR3R_PLUGIN_REF
  script:
    - mkdir -p preview dist
    - 'curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" -o artifacts.zip "${CI_API_V4_URL}/projects/862/jobs/${FAIR3R_BUILD_JOB_ID}/artifacts"'
    - python3 -m zipfile -e artifacts.zip .
    - cp dist/*.whl preview/
    - echo "PREVIEW_PACKAGE=ckanext-fair3r" > preview/override.env
    - echo "PREVIEW_WHEEL=$(basename dist/*.whl)" >> preview/override.env
  artifacts:
    paths:
      - preview/
    expire_in: 1 hour
  tags:
    - ics-docker

fetch:preview:doi:
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.10
  rules:
    - if: $DOI_PLUGIN_REF
  script:
    - mkdir -p preview dist
    - 'curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" -o artifacts.zip "${CI_API_V4_URL}/projects/860/jobs/${DOI_BUILD_JOB_ID}/artifacts"'
    - python3 -m zipfile -e artifacts.zip .
    - cp dist/*.whl preview/
    - echo "PREVIEW_PACKAGE=ckanext-fair3r-doi" > preview/override.env
    - echo "PREVIEW_WHEEL=$(basename dist/*.whl)" >> preview/override.env
  artifacts:
    paths:
      - preview/
    expire_in: 1 hour
  tags:
    - ics-docker

fetch:preview:pages:
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.10
  rules:
    - if: $PAGE_PLUGIN_REF
  script:
    - mkdir -p preview dist
    - 'curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" -o artifacts.zip "${CI_API_V4_URL}/projects/863/jobs/${PAGE_BUILD_JOB_ID}/artifacts"'
    - python3 -m zipfile -e artifacts.zip .
    - cp dist/*.whl preview/
    - echo "PREVIEW_PACKAGE=ckanext-fair3r-pages" > preview/override.env
    - echo "PREVIEW_WHEEL=$(basename dist/*.whl)" >> preview/override.env
  artifacts:
    paths:
      - preview/
    expire_in: 1 hour
  tags:
    - ics-docker

fetch:preview:plotly:
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.10
  rules:
    - if: $PLOTLY_PLUGIN_REF
  script:
    - mkdir -p preview dist
    - 'curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" -o artifacts.zip "${CI_API_V4_URL}/projects/891/jobs/${PLOTLY_BUILD_JOB_ID}/artifacts"'
    - python3 -m zipfile -e artifacts.zip .
    - cp dist/*.whl preview/
    - echo "PREVIEW_PACKAGE=ckanext-fair3r-plotly" > preview/override.env
    - echo "PREVIEW_WHEEL=$(basename dist/*.whl)" >> preview/override.env
  artifacts:
    paths:
      - preview/
    expire_in: 1 hour
  tags:
    - ics-docker

# --------------------------------------------------------------------------
# Integration stage: deploy to the integration host (manual trigger).
# --------------------------------------------------------------------------

deploy_integration:
  stage: integration
  <<: *deploy_via_ansible
  needs:
    - ansible_lint
    - job: fetch:preview:fair3r
      optional: true
    - job: fetch:preview:doi
      optional: true
    - job: fetch:preview:pages
      optional: true
    - job: fetch:preview:plotly
      optional: true
  variables:
    CONTEXT: integration
    CKAN_SESSION_SECRET: $INTEGRATION_CKAN_SESSION_SECRET
    CKAN_SECRET_KEY: $INTEGRATION_CKAN_SECRET_KEY
    CKAN_APP_INSTANCE_UUID: $INTEGRATION_CKAN_APP_INSTANCE_UUID
    CKAN_DB_PASSWORD: $INTEGRATION_CKAN_DB_PASSWORD
    CKAN_DATASTORE_DB_PASSWORD: $INTEGRATION_CKAN_DATASTORE_DB_PASSWORD
    CKAN_DATASTORE_READONLY_PASSWORD: $INTEGRATION_CKAN_DATASTORE_READONLY_PASSWORD
    CKAN_BOOTSTRAP_SYSADMIN_PASSWORD: $INTEGRATION_CKAN_BOOTSTRAP_SYSADMIN_PASSWORD
    CKAN_HARVEST_USER_PASSWORD: $INTEGRATION_CKAN_HARVEST_USER_PASSWORD
    DOI_ACCOUNT_NAME: $SANDBOX_DOI_ACCOUNT_NAME
    DOI_ACCOUNT_PASSWORD: $SANDBOX_DOI_ACCOUNT_PASSWORD
    DOI_PREFIX: $SANDBOX_DOI_PREFIX
    CKAN_EMAIL_SMTP_PASSWORD: $CKAN_EMAIL_SMTP_PASSWORD
    CKAN_EMAIL_SMTP_SERVER: $CKAN_EMAIL_SMTP_SERVER
    CKAN_EMAIL_SMTP_USER: $CKAN_EMAIL_SMTP_USER
    CKAN_EMAIL_SMTP_MAIL_FROM: $CKAN_EMAIL_SMTP_MAIL_FROM
    CKAN_EMAIL_SMTP_REPLY_TO: $CKAN_EMAIL_SMTP_REPLY_TO
    CKAN_BOOTSTRAP_SYSADMIN_EMAIL: $CKAN_BOOTSTRAP_SYSADMIN_EMAIL
    # SSH_HOST, CKAN_SITE_URL, CONTACT_MAIL, DOI_PUBLISHER, DOI_SITE_TITLE:
    # not set here - they come from GitLab's own environment-scoped project
    # CI/CD variables (one value per environment: integration/validation/
    # production), so this file never names a real host or domain.
  environment:
    name: integration
    url: $CKAN_SITE_URL
  tags:
    - ics-docker

# --------------------------------------------------------------------------
# Test stage: run ckanext pytest suites on the deployed integration server
# via deploy/ckanext_test.py (see .ckanext_test anchor).
# --------------------------------------------------------------------------

test:integration:fair3r:
  <<: *ckanext_test
  variables:
    CKAN_DB_PASSWORD: $INTEGRATION_CKAN_DB_PASSWORD
    CKAN_DATASTORE_DB_PASSWORD: $INTEGRATION_CKAN_DATASTORE_DB_PASSWORD
    CKAN_DATASTORE_READONLY_PASSWORD: $INTEGRATION_CKAN_DATASTORE_READONLY_PASSWORD
    CKAN_TESTS_MODULE: ckanext.fair3r.tests
    CKAN_REMOTE_REPORT: /tmp/fair3r-report.xml
    CKAN_LOCAL_REPORT: report-integration.xml
  artifacts:
    when: always
    reports:
      junit: report-integration.xml
    paths:
      - report-integration.xml

test:integration:doi:
  <<: *ckanext_test
  variables:
    CKAN_DB_PASSWORD: $INTEGRATION_CKAN_DB_PASSWORD
    CKAN_DATASTORE_DB_PASSWORD: $INTEGRATION_CKAN_DATASTORE_DB_PASSWORD
    CKAN_DATASTORE_READONLY_PASSWORD: $INTEGRATION_CKAN_DATASTORE_READONLY_PASSWORD
    CKAN_TESTS_MODULE: ckanext.doi.tests
    CKAN_REMOTE_REPORT: /tmp/doi-report.xml
    CKAN_LOCAL_REPORT: report-doi.xml
  artifacts:
    when: always
    reports:
      junit: report-doi.xml
    paths:
      - report-doi.xml

test:integration:pages:
  <<: *ckanext_test
  variables:
    CKAN_DB_PASSWORD: $INTEGRATION_CKAN_DB_PASSWORD
    CKAN_DATASTORE_DB_PASSWORD: $INTEGRATION_CKAN_DATASTORE_DB_PASSWORD
    CKAN_DATASTORE_READONLY_PASSWORD: $INTEGRATION_CKAN_DATASTORE_READONLY_PASSWORD
    CKAN_TESTS_MODULE: ckanext.pages.tests
    CKAN_REMOTE_REPORT: /tmp/pages-report.xml
    CKAN_LOCAL_REPORT: report-pages.xml
  artifacts:
    when: always
    reports:
      junit: report-pages.xml
    paths:
      - report-pages.xml

test:integration:plotly:
  <<: *ckanext_test
  variables:
    CKAN_DB_PASSWORD: $INTEGRATION_CKAN_DB_PASSWORD
    CKAN_DATASTORE_DB_PASSWORD: $INTEGRATION_CKAN_DATASTORE_DB_PASSWORD
    CKAN_DATASTORE_READONLY_PASSWORD: $INTEGRATION_CKAN_DATASTORE_READONLY_PASSWORD
    CKAN_TESTS_MODULE: ckanext.plotly.tests
    CKAN_REMOTE_REPORT: /tmp/plotly-report.xml
    CKAN_LOCAL_REPORT: report-plotly.xml
  artifacts:
    when: always
    reports:
      junit: report-plotly.xml
    paths:
      - report-plotly.xml

# --------------------------------------------------------------------------
# Validation stage: deploy to the validation host (manual trigger).
# --------------------------------------------------------------------------

deploy_validation:
  stage: validation
  <<: *deploy_via_ansible
  variables:
    CONTEXT: validation
    # Per-context secrets (sourced from GitLab CI variables):
    CKAN_SESSION_SECRET: $VALIDATION_CKAN_SESSION_SECRET
    CKAN_SECRET_KEY: $VALIDATION_CKAN_SECRET_KEY
    CKAN_APP_INSTANCE_UUID: $VALIDATION_CKAN_APP_INSTANCE_UUID
    CKAN_DB_PASSWORD: $VALIDATION_CKAN_DB_PASSWORD
    CKAN_DATASTORE_DB_PASSWORD: $VALIDATION_CKAN_DATASTORE_DB_PASSWORD
    CKAN_DATASTORE_READONLY_PASSWORD: $VALIDATION_CKAN_DATASTORE_READONLY_PASSWORD
    CKAN_BOOTSTRAP_SYSADMIN_PASSWORD: $VALIDATION_CKAN_BOOTSTRAP_SYSADMIN_PASSWORD
    CKAN_HARVEST_USER_PASSWORD: $VALIDATION_CKAN_HARVEST_USER_PASSWORD
    DOI_ACCOUNT_NAME: $SANDBOX_DOI_ACCOUNT_NAME
    DOI_ACCOUNT_PASSWORD: $SANDBOX_DOI_ACCOUNT_PASSWORD
    DOI_PREFIX: $SANDBOX_DOI_PREFIX
    CKAN_EMAIL_SMTP_PASSWORD: $CKAN_EMAIL_SMTP_PASSWORD
    CKAN_EMAIL_SMTP_SERVER: $CKAN_EMAIL_SMTP_SERVER
    CKAN_EMAIL_SMTP_USER: $CKAN_EMAIL_SMTP_USER
    CKAN_EMAIL_SMTP_MAIL_FROM: $CKAN_EMAIL_SMTP_MAIL_FROM
    CKAN_EMAIL_SMTP_REPLY_TO: $CKAN_EMAIL_SMTP_REPLY_TO
    CKAN_BOOTSTRAP_SYSADMIN_EMAIL: $CKAN_BOOTSTRAP_SYSADMIN_EMAIL
    # SSH_HOST, CKAN_SITE_URL, CONTACT_MAIL, DOI_PUBLISHER, DOI_SITE_TITLE:
    # see deploy_integration above - same reasoning, scoped to this
    # environment in GitLab instead.
  needs:
    - job: deploy_integration
      optional: true
    - job: test:integration:fair3r
      optional: true
    - job: test:integration:doi
      optional: true
    - job: test:integration:pages
      optional: true
    - job: test:integration:plotly
      optional: true
  when: manual
  environment:
    name: validation
    url: $CKAN_SITE_URL
  tags:
    - ics-docker

# --------------------------------------------------------------------------
# Production stage: deploy to the production host (manual; does NOT gate on
# validation or integration — operators choose when to promote).
# --------------------------------------------------------------------------

deploy_production:
  stage: production
  <<: *deploy_via_ansible
  variables:
    CONTEXT: production
    # Per-context secrets (sourced from GitLab CI variables):
    CKAN_SESSION_SECRET: $PRODUCTION_CKAN_SESSION_SECRET
    CKAN_SECRET_KEY: $PRODUCTION_CKAN_SECRET_KEY
    CKAN_APP_INSTANCE_UUID: $PRODUCTION_CKAN_APP_INSTANCE_UUID
    CKAN_DB_PASSWORD: $PRODUCTION_CKAN_DB_PASSWORD
    CKAN_DATASTORE_DB_PASSWORD: $PRODUCTION_CKAN_DATASTORE_DB_PASSWORD
    CKAN_DATASTORE_READONLY_PASSWORD: $PRODUCTION_CKAN_DATASTORE_READONLY_PASSWORD
    CKAN_BOOTSTRAP_SYSADMIN_PASSWORD: $PRODUCTION_CKAN_BOOTSTRAP_SYSADMIN_PASSWORD
    CKAN_HARVEST_USER_PASSWORD: $PRODUCTION_CKAN_HARVEST_USER_PASSWORD
    DOI_ACCOUNT_NAME: $PRODUCTION_DOI_ACCOUNT_NAME
    DOI_ACCOUNT_PASSWORD: $PRODUCTION_DOI_ACCOUNT_PASSWORD
    DOI_PREFIX: $PRODUCTION_DOI_PREFIX
    CKAN_EMAIL_SMTP_PASSWORD: $CKAN_EMAIL_SMTP_PASSWORD
    CKAN_EMAIL_SMTP_SERVER: $CKAN_EMAIL_SMTP_SERVER
    CKAN_EMAIL_SMTP_USER: $CKAN_EMAIL_SMTP_USER
    CKAN_EMAIL_SMTP_MAIL_FROM: $CKAN_EMAIL_SMTP_MAIL_FROM
    CKAN_EMAIL_SMTP_REPLY_TO: $CKAN_EMAIL_SMTP_REPLY_TO
    CKAN_BOOTSTRAP_SYSADMIN_EMAIL: $CKAN_BOOTSTRAP_SYSADMIN_EMAIL
    # SSH_HOST, CKAN_SITE_URL, CONTACT_MAIL, DOI_PUBLISHER, DOI_SITE_TITLE:
    # see deploy_integration above - same reasoning, scoped to this
    # environment in GitLab instead.
  when: manual
  needs:
    - deploy_validation
  environment:
    name: production
    url: $CKAN_SITE_URL
  tags:
    - ics-docker
